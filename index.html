<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Radar de Monitoramento Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; } 
        body { margin: 0; padding: 0; background-color: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        #clima-painel {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: rgba(0, 0, 0, 0.85); color: white; padding: 15px;
            border-radius: 12px; border: 1px solid #444; min-width: 220px;
        }

        .painel-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 8px;
        }

        /* Botão de Trânsito com estado Ativo/Inativo */
        .btn-transito-topo {
            cursor: pointer; font-size: 20px; transition: 0.3s;
            background: rgba(255,255,255,0.1); padding: 5px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-transito-topo.ativo { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .btn-transito-topo:hover { transform: scale(1.1); }

        .info-item { 
            margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 8px; 
            cursor: pointer; transition: 0.3s; border-radius: 8px;
        }
        .info-item:hover { background: rgba(255, 255, 255, 0.1); padding-left: 5px; }
        .info-item:last-child { border-bottom: none; }

        .nome { font-weight: bold; display: block; margin-bottom: 2px; font-size: 14px; }
        .localizacao { font-size: 12px; color: #00ff00; font-weight: bold; display: block; }
        .detalhes { font-size: 11px; color: #aaa; display: block; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background-color: #00ff00; box-shadow: 0 0 5px #00ff00; }
        .alerta { background-color: #ffff00; box-shadow: 0 0 5px #ffff00; }
        .offline { background-color: #ff4d4d; box-shadow: 0 0 5px #ff4d4d; }

        .emoji-pin { font-size: 24px; text-align: center; line-height: 1; filter: drop-shadow(0 0 2px black); }
    </style>
</head>
<body>

    <div id="clima-painel">
        <div class="painel-header">
            <span style="font-size: 12px; color: #aaa; font-weight: bold;">MONITORAMENTO</span>
            <div id="btn-traff" class="btn-transito-topo" onclick="toggleTransito()" title="Ligar/Desligar Trânsito">🚦</div>
        </div>

        <div class="info-item" onclick="focarDron('g8')">
            <span class="nome" style="color: #ff4d4d;">👑 G8</span>
            <span id="loc-g8" class="localizacao">Conectando...</span>
            <span id="detalhes-g8" class="detalhes">--</span>
        </div>

        <div class="info-item" onclick="focarDron('miih')">
            <span class="nome" style="color: #ee82ee;">🌸 Miih</span>
            <span id="loc-miih" class="localizacao">Conectando...</span>
            <span id="detalhes-miih" class="detalhes">--</span>
        </div>

        <div class="info-item" onclick="focarDron('gustavo')">
            <span class="nome" style="color: #4d94ff;">🤖 Gustavo</span>
            <span id="loc-gustavo" class="localizacao">Conectando...</span>
            <span id="detalhes-gustavo" class="detalhes">--</span>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://meu-rastreador-7a0a8-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Mapa Base (Satélite Google)
        const map = L.map('map').setView([-22.4818, -44.0492], 15);
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}').addTo(map);

        // Camada de Trânsito (Real-time via TomTom/OSM Open Data)
        const trafficLayer = L.tileLayer('https://{s}.tile.openweathermap.org/map/pressure_new/{z}/{x}/{y}.png?appid=YOUR_KEY', {
            opacity: 0.5
        }); 
        
        // Versão alternativa de trânsito usando a API do Google (requer que o mapa base suporte)
        // Como estamos usando tiles diretos, a melhor forma de ver trânsito na mesma aba é sobrepor
        const transitoURL = 'https://mt1.google.com/vt?lyrs=h@159000000,traffic|seconds_into_week:-1&style=3&x={x}&y={y}&z={z}';
        const googleTraffic = L.tileLayer(transitoURL, { maxZoom: 20 });

        let transitoAtivo = false;
        window.toggleTransito = function() {
            const btn = document.getElementById('btn-traff');
            if (!transitoAtivo) {
                googleTraffic.addTo(map);
                btn.classList.add('ativo');
                transitoAtivo = true;
            } else {
                map.removeLayer(googleTraffic);
                btn.classList.remove('ativo');
                transitoAtivo = false;
            }
        };

        const pontosInteresse = {
            casa: { nome: "Casa", lat: -22.4818724, lon: -44.0492843, raio: 25, cor: '#00ff00' },
            casaVo: { nome: "Casa da Vó", lat: -22.4816722, lon: -44.0503214, raio: 25, cor: '#ffa500' },
            trabalhoG8: { nome: "Trabalho G8", lat: -22.5068037, lon: -44.0924050, raio: 25, cor: '#ff4d4d' },
            trabalhoMiih: { nome: "Trabalho Miih", lat: -22.5192858, lon: -44.1047733, raio: 25, cor: '#ee82ee' },
            escolaGustavo: { nome: "Escola Gustavo", lat: -22.4798095, lon: -44.0453219, raio: 100, cor: '#4d94ff' },
            recreio: { nome: "Recreio", lat: -21.5275156, lon: -42.4737572, raio: 25, cor: '#ffffff' }
        };

        Object.values(pontosInteresse).forEach(p => {
            L.circle([p.lat, p.lon], { radius: p.raio, color: p.cor, fillOpacity: 0.1, weight: 1 }).addTo(map);
        });

        const criarEmojiIcon = (emoji) => L.divIcon({
            html: `<div class="emoji-pin">${emoji}</div>`,
            className: 'custom-div-icon', iconSize: [30, 30], iconAnchor: [15, 15]
        });

        const drones = {
            g8: { marker: L.marker([0,0], {icon: criarEmojiIcon('👑')}).addTo(map), trail: L.polyline([], {color: '#ff4d4d', weight: 3}).addTo(map), ultimaVez: 0 },
            miih: { marker: L.marker([0,0], {icon: criarEmojiIcon('🌸')}).addTo(map), trail: L.polyline([], {color: '#ee82ee', weight: 3}).addTo(map), ultimaVez: 0 },
            gustavo: { marker: L.marker([0,0], {icon: criarEmojiIcon('🤖')}).addTo(map), trail: L.polyline([], {color: '#4d94ff', weight: 3}).addTo(map), ultimaVez: 0 }
        };

        window.focarDron = function(id) {
            const pos = drones[id].marker.getLatLng();
            if (pos.lat !== 0) {
                map.flyTo(pos, 17, { animate: true, duration: 1.5 });
                drones[id].marker.bindPopup(`<b>${id.toUpperCase()}</b>`).openPopup();
            }
        };

        function verificarLocal(id, lat, lon) {
            for (let chave in pontosInteresse) {
                let p = pontosInteresse[chave];
                if (map.distance([lat, lon], [p.lat, p.lon]) <= p.raio) {
                    if (chave === 'casa') return "📍 Em Casa";
                    if (chave === 'casaVo') return "👵 Casa da Vó";
                    if (chave === 'recreio') return "🏖️ Em Recreio";
                    if (chave === 'trabalhoG8' && id === 'g8') return "🏢 No Trabalho";
                    if (chave === 'trabalhoMiih' && id === 'miih') return "🏢 No Trabalho";
                    if (chave === 'escolaGustavo' && id === 'gustavo') return "📚 Na Escola";
                }
            }
            return "🚗 Em Trânsito / Rua";
        }

        async function buscarClima(lat, lon) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await response.json();
                return data.current_weather.temperature + "°C";
            } catch (e) { return "--°C"; }
        }

        async function atualizar(snapshot, id) {
            const data = snapshot.val();
            if (!data) return;
            const keys = Object.keys(data);
            const reg = data.lat ? data : data[keys[keys.length - 1]];

            let lat = reg.lat, lon = reg.lon;
            if (reg.location && reg.location._) {
                const txt = reg.location._;
                lat = parseFloat(txt.match(/lat=([^&]+)/)[1]);
                lon = parseFloat(txt.match(/lon=([^&]+)/)[1]);
            }

            if (lat && lon && lat !== 0) {
                const pos = [lat, lon];
                drones[id].marker.setLatLng(pos);
                drones[id].ultimaVez = Date.now();
                drones[id].trail.addLatLng(pos);

                const local = verificarLocal(id, lat, lon);
                const temp = await buscarClima(lat, lon);
                const vel = reg.speed ? (parseFloat(reg.speed) * 1.852).toFixed(0) : "0";
                const hora = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                document.getElementById(`loc-${id}`).innerText = local;
                document.getElementById(`detalhes-${id}`).innerHTML = `<span id="dot-${id}" class="status-dot online"></span> ${temp} | ${vel} km/h | ${hora}`;
            }
        }

        setInterval(() => {
            const agora = Date.now();
            Object.keys(drones).forEach(id => {
                const dot = document.getElementById(`dot-${id}`);
                if (!dot) return;
                const diff = (agora - drones[id].ultimaVez) / 1000 / 60;
                if (diff > 10) dot.className = "status-dot offline";
                else if (diff > 5) dot.className = "status-dot alerta";
                else dot.className = "status-dot online";
            });
        }, 10000);

        onValue(ref(db, 'g8'), (s) => atualizar(s, 'g8'));
        onValue(ref(db, 'miih'), (s) => atualizar(s, 'miih'));
        onValue(ref(db, 'gustavo'), (s) => atualizar(s, 'gustavo'));
    </script>
</body>
</html>
