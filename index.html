<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Radar de Monitoramento Pro - Versão Final</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        #map { height: 100vh; width: 100%; } 
        body { margin: 0; padding: 0; background-color: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        #clima-painel {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: rgba(0, 0, 0, 0.85); color: white; padding: 15px;
            border-radius: 12px; border: 1px solid #444; min-width: 250px;
        }

        .painel-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 8px;
        }

        .info-item { 
            margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; 
            display: flex; justify-content: space-between; align-items: center;
        }

        .user-data { cursor: pointer; flex-grow: 1; }

        .btn-lock {
            background: rgba(255,255,255,0.1); border: none; color: white;
            padding: 8px; border-radius: 50%; cursor: pointer; transition: 0.3s;
            margin-left: 10px; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;
        }
        
        .btn-lock.ativo { background: #00ff00; color: black; box-shadow: 0 0 10px #00ff00; }

        .nome { font-weight: bold; font-size: 14px; display: block; }
        .localizacao { font-size: 12px; color: #00ff00; font-weight: bold; display: block; }
        .detalhes { font-size: 11px; color: #aaa; display: block; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background-color: #00ff00; box-shadow: 0 0 5px #00ff00; }

        .emoji-pin { font-size: 24px; text-align: center; line-height: 1; filter: drop-shadow(0 0 2px black); }

        .leaflet-routing-container {
            background: rgba(0, 0, 0, 0.9) !important;
            color: #fff !important; font-size: 11px; max-height: 180px; overflow-y: auto;
        }
    </style>
</head>
<body>

    <div id="clima-painel">
        <div class="painel-header">
            <span style="font-size: 10px; color: #aaa; font-weight: bold;">MONITORAMENTO ATIVO</span>
            <div style="display: flex; gap: 5px;">
                <button class="btn-lock" onclick="toggleTransito()" title="Trânsito">🚦</button>
                <button class="btn-lock" onclick="limparRota()" title="Limpar Rota" style="color:#ff4d4d;">✕</button>
            </div>
        </div>

        <div class="info-item">
            <div class="user-data" onclick="focarDron('g8')">
                <span class="nome" style="color: #ff4d4d;">👑 G8</span>
                <span id="loc-g8" class="localizacao">Conectando...</span>
                <span id="detalhes-g8" class="detalhes">--</span>
            </div>
            <button id="lock-g8" class="btn-lock" onclick="toggleLock('g8')" title="Seguir G8">🔒</button>
        </div>

        <div class="info-item">
            <div class="user-data" onclick="focarDron('miih')">
                <span class="nome" style="color: #ee82ee;">🌸 Miih</span>
                <span id="loc-miih" class="localizacao">Conectando...</span>
                <span id="detalhes-miih" class="detalhes">--</span>
            </div>
            <button id="lock-miih" class="btn-lock" onclick="toggleLock('miih')" title="Seguir Miih">🔒</button>
        </div>

        <div class="info-item">
            <div class="user-data" onclick="focarDron('gustavo')">
                <span class="nome" style="color: #4d94ff;">🤖 Gustavo</span>
                <span id="loc-gustavo" class="localizacao">Conectando...</span>
                <span id="detalhes-gustavo" class="detalhes">--</span>
            </div>
            <button id="lock-gustavo" class="btn-lock" onclick="toggleLock('gustavo')" title="Seguir Gustavo">🔒</button>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://meu-rastreador-7a0a8-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- MAPA ---
        const map = L.map('map').setView([-22.4818, -44.0492], 15);
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}').addTo(map);

        // --- BUSCA DE ENDEREÇO ---
        const geocoder = L.Control.geocoder({ defaultMarkGeocode: false, position: 'topleft' }).addTo(map);
        geocoder.on('markgeocode', (e) => {
            const latlng = e.geocode.center;
            map.flyTo(latlng, 17);
            L.popup().setLatLng(latlng).setContent(`<b>${e.geocode.name}</b><br><button onclick="irAte(${latlng.lat}, ${latlng.lng})" style="width:100%; margin-top:10px; cursor:pointer;">🚀 IR PARA AQUI</button>`).openOn(map);
        });

        // --- GPS E TRÂNSITO ---
        let controleRota = null;
        let transitoAtivo = false;
        const googleTraffic = L.tileLayer('https://mt1.google.com/vt?lyrs=h@159000000,traffic|seconds_into_week:-1&style=3&x={x}&y={y}&z={z}', { maxZoom: 20 });

        window.limparRota = () => { if(controleRota) { map.removeControl(controleRota); controleRota = null; } };
        window.toggleTransito = () => {
            transitoAtivo ? map.removeLayer(googleTraffic) : googleTraffic.addTo(map);
            transitoAtivo = !transitoAtivo;
        };

        window.irAte = (lat, lon) => {
            limparRota();
            map.locate({setView: false});
            map.once('locationfound', (e) => {
                controleRota = L.Routing.control({
                    waypoints: [ L.latLng(e.latlng), L.latLng(lat, lon) ],
                    language: 'pt-BR'
                }).addTo(map);
                map.closePopup();
            });
        };

        // --- PONTOS DE INTERESSE (POIs) ---
        const pontosInteresse = {
            casa: { nome: "Casa", lat: -22.4818724, lon: -44.0492843, raio: 25, cor: '#00ff00', icone: "🏠" },
            casaVo: { nome: "Casa da Vó", lat: -22.4816722, lon: -44.0503214, raio: 25, cor: '#ffa500', icone: "👵" },
            ronoel: { nome: "Ronoel", lat: -22.47913780425358, lon: -44.0485040059705, raio: 10, cor: '#ffffff', icone: "📍" },
            madson: { nome: "Madson", lat: -22.480922713559334, lon: -44.04805947755113, raio: 10, cor: '#ffffff', icone: "📍" },
            padaria: { nome: "Padaria Du Vale", lat: -22.480842421901734, lon: -44.04714813233181, raio: 10, cor: '#ffa500', icone: "🥐" }
        };

        // Desenhar círculos no mapa
        Object.values(pontosInteresse).forEach(p => {
            L.circle([p.lat, p.lon], { radius: p.raio, color: p.cor, fillOpacity: 0.1, weight: 1 }).addTo(map).bindPopup(p.nome);
        });

        // --- MONITORAMENTO ---
        const criarEmojiIcon = (emoji) => L.divIcon({
            html: `<div class="emoji-pin">${emoji}</div>`,
            className: 'custom-div-icon', iconSize: [30, 30], iconAnchor: [15, 15]
        });

        const drones = {
            g8: { marker: L.marker([0,0], {icon: criarEmojiIcon('👑')}).addTo(map), ultimaVez: 0, locked: false },
            miih: { marker: L.marker([0,0], {icon: criarEmojiIcon('🌸')}).addTo(map), ultimaVez: 0, locked: false },
            gustavo: { marker: L.marker([0,0], {icon: criarEmojiIcon('🤖')}).addTo(map), ultimaVez: 0, locked: false }
        };

        window.toggleLock = (id) => {
            // Desativa outros bloqueios para focar em apenas um
            Object.keys(drones).forEach(key => {
                if(key !== id) {
                    drones[key].locked = false;
                    document.getElementById(`lock-${key}`).classList.remove('ativo');
                    document.getElementById(`lock-${key}`).innerHTML = "🔒";
                }
            });
            drones[id].locked = !drones[id].locked;
            const btn = document.getElementById(`lock-${id}`);
            btn.classList.toggle('ativo');
            btn.innerHTML = drones[id].locked ? "🔓" : "🔒";
            if(drones[id].locked) map.panTo(drones[id].marker.getLatLng());
        };

        window.focarDron = (id) => {
            const pos = drones[id].marker.getLatLng();
            if (pos.lat !== 0) {
                map.flyTo(pos, 17);
                drones[id].marker.bindPopup(`<b>${id.toUpperCase()}</b><br><button onclick="irAte(${pos.lat}, ${pos.lng})">🚗 Rota GPS</button>`).openPopup();
            }
        };

        function verificarLocal(lat, lon) {
            for (let chave in pontosInteresse) {
                let p = pontosInteresse[chave];
                if (map.distance([lat, lon], [p.lat, p.lon]) <= p.raio) {
                    return `${p.icone} ${p.nome}`;
                }
            }
            return "🚗 Em Trânsito";
        }

        async function atualizar(snapshot, id) {
            const data = snapshot.val();
            if (!data) return;
            const keys = Object.keys(data);
            const reg = data.lat ? data : data[keys[keys.length - 1]];

            let lat = reg.lat, lon = reg.lon;
            if (reg.location && reg.location._) {
                const txt = reg.location._;
                try {
                    lat = parseFloat(txt.match(/lat=([^&]+)/)[1]);
                    lon = parseFloat(txt.match(/lon=([^&]+)/)[1]);
                } catch(e) {}
            }

            if (lat && lon && lat !== 0) {
                const pos = [lat, lon];
                drones[id].marker.setLatLng(pos);
                drones[id].ultimaVez = Date.now();

                if (drones[id].locked) map.panTo(pos, { animate: true, duration: 0.5 });

                const localStatus = verificarLocal(lat, lon);
                const hora = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                document.getElementById(`loc-${id}`).innerText = localStatus;
                document.getElementById(`detalhes-${id}`).innerHTML = `<span id="dot-${id}" class="status-dot online"></span> Sincronizado: ${hora}`;
            }
        }

        onValue(ref(db, 'g8'), (s) => atualizar(s, 'g8'));
        onValue(ref(db, 'miih'), (s) => atualizar(s, 'miih'));
        onValue(ref(db, 'gustavo'), (s) => atualizar(s, 'gustavo'));
    </script>
</body>
</html>
