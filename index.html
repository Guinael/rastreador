<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Monitor Player</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        #map { height: 100vh; width: 100%; } 
        body { margin: 0; padding: 0; background-color: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        /* --- ESTILOS DE IDENTIFICAÇÃO --- */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: #111; padding: 30px; border-radius: 15px; border: 1px solid #00ff00;
            text-align: center; box-shadow: 0 0 20px rgba(0,255,0,0.2);
        }
        .login-card h2 { color: #00ff00; margin-top: 0; font-size: 18px; letter-spacing: 1px; }
        .login-card input {
            width: 100%; padding: 12px; margin: 15px 0; background: #222; 
            border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box;
        }
        .login-card button {
            background: #00ff00; color: black; border: none; padding: 10px 25px;
            font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%;
        }

        #clima-painel {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: rgba(0, 0, 0, 0.85); color: white; padding: 15px;
            border-radius: 12px; border: 1px solid #444; min-width: 250px;
        }

        /* Ajuste do painel para celular */
        @media (max-width: 600px) {
            #clima-painel { 
                width: 90%; right: 5%; left: 5%; min-width: 0; top: 10px; 
                padding: 10px; box-sizing: border-box;
            }
            .btn-lock { width: 45px !important; height: 45px !important; font-size: 18px !important; }
            .nome { font-size: 16px !important; }
            #footer-player { height: 110px !important; padding-bottom: 15px !important; }
            .player-controls { gap: 15px !important; }
            .play-btn { width: 50px !important; height: 50px !important; }
            #track-name { position: static !important; text-align: center; margin-bottom: 5px; width: 100%; }
            .vol-container { display: none !important; } /* Oculta volume no celular para sobrar espaço */
            #chat-box { width: 90% !important; left: 5%; right: 5%; height: 45vh !important; bottom: 120px !important; }
            #chat-toggle { bottom: 120px !important; width: 50px !important; height: 50px !important; }
            #video-container { width: 90% !important; left: 5% !important; bottom: 120px !important; }
        }

        .painel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .info-item { margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .user-data { cursor: pointer; flex-grow: 1; }
        .btn-lock { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px; border-radius: 50%; cursor: pointer; transition: 0.3s; margin-left: 10px; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; }
        .btn-lock.ativo { background: #00ff00; color: black; box-shadow: 0 0 10px #00ff00; }
        .nome { font-weight: bold; font-size: 14px; display: block; }
        .localizacao { font-size: 12px; color: #00ff00; font-weight: bold; display: block; }
        .detalhes { font-size: 11px; color: #aaa; display: block; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background-color: #00ff00; box-shadow: 0 0 5px #00ff00; }
        .emoji-pin { font-size: 24px; text-align: center; line-height: 1; filter: drop-shadow(0 0 2px black); }
        .leaflet-routing-container { background: rgba(0, 0, 0, 0.9) !important; color: #fff !important; font-size: 11px; max-height: 180px; overflow-y: auto; }

        #footer-player { position: absolute; bottom: 0; left: 0; right: 0; z-index: 1001; background: rgba(0, 0, 0, 0.95); height: 90px; border-top: 1px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px; color: white; }
        .player-controls { display: flex; align-items: center; gap: 20px; margin-bottom: 5px; }
        .control-btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 22px; transition: 0.2s; }
        .play-btn { background: white; color: black; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .progress-box { width: 100%; max-width: 700px; display: flex; align-items: center; gap: 10px; }
        .progress-bar { flex-grow: 1; height: 4px; background: #444; border-radius: 2px; cursor: pointer; position: relative; }
        #progress-fill { height: 100%; background: #00ff00; width: 0%; border-radius: 2px; }
        .time-label { font-size: 11px; color: #888; min-width: 35px; }
        #track-name { position: absolute; left: 20px; font-size: 11px; color: #00ff00; font-weight: bold; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #video-container { position: absolute; bottom: 100px; left: 20px; z-index: 1000; width: 320px; background: #000; border: 2px solid #333; border-radius: 10px; display: none; overflow: hidden; }
        #main-media { width: 100%; display: block; }

        .vol-container { display: flex; align-items: center; gap: 5px; margin-left: 10px; }
        #vol-control { width: 70px; cursor: pointer; accent-color: #00ff00; }
        #chat-box { position: absolute; bottom: 100px; right: 20px; width: 280px; height: 350px; background: rgba(0,0,0,0.9); border: 1px solid #444; border-radius: 8px; z-index: 1000; display: none; flex-direction: column; }
        #chat-content { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; color: #fff; }
        #chat-input-wrap { display: flex; border-top: 1px solid #333; padding: 5px; }
        #chat-input-wrap input { flex: 1; background: #222; border: none; color: #fff; padding: 5px; border-radius: 4px; }
        #chat-toggle { position: absolute; bottom: 100px; right: 20px; z-index: 1001; background: #00ff00; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2>ACESSO AO MONITOR</h2>
            <input type="text" id="user-name" placeholder="Digite seu nome..." autocomplete="off">
            <button onclick="fazerLogin()">CONECTAR</button>
        </div>
    </div>

    <div id="clima-painel">
        <div class="painel-header">
            <span style="font-size: 10px; color: #aaa; font-weight: bold;">MONITORAMENTO ATIVO</span>
            <div style="display: flex; gap: 5px;">
                <button class="btn-lock" onclick="toggleTransito()" title="Trânsito">🚦</button>
                <button class="btn-lock" onclick="limparRota()" title="Limpar Rota" style="color:#ff4d4d;">✕</button>
            </div>
        </div>

        <div class="info-item">
            <div class="user-data" onclick="focarDron('g8')">
                <span class="nome" style="color: #ff4d4d;">👑 G8</span>
                <span id="loc-g8" class="localizacao">Conectando...</span>
                <span id="detalhes-g8" class="detalhes">--</span>
            </div>
            <button id="lock-g8" class="btn-lock" onclick="toggleLock('g8')" title="Seguir G8">🔒</button>
        </div>

        <div class="info-item">
            <div class="user-data" onclick="focarDron('miih')">
                <span class="nome" style="color: #ee82ee;">🌸 Miih</span>
                <span id="loc-miih" class="localizacao">Conectando...</span>
                <span id="detalhes-miih" class="detalhes">--</span>
            </div>
            <button id="lock-miih" class="btn-lock" onclick="toggleLock('miih')" title="Seguir Miih">🔒</button>
        </div>

        <div class="info-item">
            <div class="user-data" onclick="focarDron('gustavo')">
                <span class="nome" style="color: #4d94ff;">🤖 Gustavo</span>
                <span id="loc-gustavo" class="localizacao">Conectando...</span>
                <span id="detalhes-gustavo" class="detalhes">--</span>
            </div>
            <button id="lock-gustavo" class="btn-lock" onclick="toggleLock('gustavo')" title="Seguir Gustavo">🔒</button>
        </div>
    </div>

    <button id="chat-toggle" onclick="toggleChat()">💬</button>
    <div id="chat-box">
        <div style="padding: 8px; border-bottom: 1px solid #333; font-size: 10px; color: #00ff00;">CHAT OPERACIONAL</div>
        <div id="chat-content"></div>
        <div id="chat-input-wrap">
            <input type="text" id="chat-msg" placeholder="Mensagem..." onkeypress="if(event.key==='Enter') sendChat()">
        </div>
    </div>

    <div id="video-container"><video id="main-media"></video></div>

    <div id="footer-player">
        <div id="track-name">SEM MÍDIA</div>
        <div class="player-controls">
            <button class="control-btn" onclick="document.getElementById('media-upload').click()" title="Abrir Mídia">⏏</button>
            <button class="control-btn" onclick="stopMedia()" title="Parar">⏹</button>
            <button class="control-btn" onclick="prevTrack()" title="Anterior">⏮</button>
            <button id="master-play" class="control-btn play-btn" onclick="pressPlay()">▶</button>
            <button class="control-btn" onclick="nextTrack()" title="Próxima">⏭</button>
        </div>
        <div class="progress-box">
            <span id="time-now" class="time-label">0:00</span>
            <div class="progress-bar" onclick="manualSeek(event)"><div id="progress-fill"></div></div>
            <span id="time-end" class="time-label">0:00</span>
            <div class="vol-container">
                <span style="font-size: 12px;">🔊</span>
                <input type="range" id="vol-control" min="0" max="1" step="0.1" value="1" oninput="mediaObj.volume = this.value">
            </div>
        </div>
        <input type="file" id="media-upload" accept="audio/*,video/*" multiple style="display: none;">
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://meu-rastreador-7a0a8-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- LÓGICA DE IDENTIFICAÇÃO ---
        window.fazerLogin = () => {
            const nome = document.getElementById('user-name').value.trim();
            if(nome.length >= 2) {
                sessionStorage.setItem('nome_monitor', nome);
                document.getElementById('login-overlay').style.display = 'none';
            } else { alert("Por favor, digite seu nome."); }
        };

        // --- LÓGICA DO CHAT ATUALIZADA ---
        window.toggleChat = () => {
            const chat = document.getElementById('chat-box');
            chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
        };

        window.sendChat = () => {
            const input = document.getElementById('chat-msg');
            const nomeUser = sessionStorage.getItem('nome_monitor') || 'Anônimo';
            if(input.value.trim()){
                push(ref(db, 'mensagens'), { 
                    usuario: nomeUser,
                    texto: input.value, 
                    timestamp: serverTimestamp() 
                });
                input.value = '';
            }
        };

        onValue(ref(db, 'mensagens'), (snap) => {
            const content = document.getElementById('chat-content');
            content.innerHTML = '';
            snap.forEach(m => {
                const data = m.val();
                content.innerHTML += `<div><strong style="color:#00ff00">${data.usuario || '?'}:</strong> ${data.texto}</div>`;
            });
            content.scrollTop = content.scrollHeight;
        });

        // --- MAPA E TRACKING ---
        const map = L.map('map').setView([-22.4818, -44.0492], 15);
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}').addTo(map);

        const mediaObj = document.getElementById('main-media');
        const playBtnIcon = document.getElementById('master-play');
        const progBar = document.getElementById('progress-fill');
        const trackTitle = document.getElementById('track-name');
        const vContainer = document.getElementById('video-container');
        let playlist = [], currentTrackIndex = 0;
        window.mediaObj = mediaObj;

        document.getElementById('media-upload').onchange = function(e) {
            const files = Array.from(e.target.files);
            if (files.length > 0) { playlist = files; currentTrackIndex = 0; loadTrack(currentTrackIndex); }
        };
        function loadTrack(index) {
            const file = playlist[index];
            const isVideo = file.type.startsWith('video');
            vContainer.style.display = isVideo ? 'block' : 'none';
            mediaObj.src = URL.createObjectURL(file);
            trackTitle.innerText = `${index + 1}/${playlist.length} ${isVideo ? "🎬" : "🎵"} ${file.name.toUpperCase()}`;
            mediaObj.play(); playBtnIcon.innerText = "⏸";
        }
        window.pressPlay = () => { if (!mediaObj.src) return; mediaObj.paused ? mediaObj.play() : mediaObj.pause(); playBtnIcon.innerText = mediaObj.paused ? "▶" : "⏸"; };
        window.stopMedia = () => { mediaObj.pause(); mediaObj.src = ""; vContainer.style.display = "none"; trackTitle.innerText = "SEM MÍDIA"; progBar.style.width = "0%"; playBtnIcon.innerText = "▶"; playlist = []; };
        window.nextTrack = () => { if (playlist.length === 0) return; currentTrackIndex = (currentTrackIndex + 1) % playlist.length; loadTrack(currentTrackIndex); };
        window.prevTrack = () => { if (playlist.length === 0) return; currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length; loadTrack(currentTrackIndex); };
        mediaObj.ontimeupdate = () => { if (mediaObj.duration) { progBar.style.width = (mediaObj.currentTime / mediaObj.duration * 100) + "%"; document.getElementById('time-now').innerText = fmtTime(mediaObj.currentTime); document.getElementById('time-end').innerText = fmtTime(mediaObj.duration); } };
        window.manualSeek = (e) => { const rect = e.currentTarget.getBoundingClientRect(); mediaObj.currentTime = ((e.clientX - rect.left) / rect.width) * mediaObj.duration; };
        function fmtTime(s) { const m = Math.floor(s/60), sec = Math.floor(s%60); return `${m}:${sec < 10 ? '0' : ''}${sec}`; }

        const geocoder = L.Control.geocoder({ defaultMarkGeocode: false, position: 'topleft' }).addTo(map);
        geocoder.on('markgeocode', (e) => { map.flyTo(e.geocode.center, 17); L.popup().setLatLng(e.geocode.center).setContent(`<b>${e.geocode.name}</b><br><button onclick="irAte(${e.geocode.center.lat}, ${e.geocode.center.lng})" style="width:100%; margin-top:10px;">🚀 IR PARA AQUI</button>`).openOn(map); });

        let controleRota = null, transitoAtivo = false;
        const googleTraffic = L.tileLayer('https://mt1.google.com/vt?lyrs=h@159000000,traffic|seconds_into_week:-1&style=3&x={x}&y={y}&z={z}');
        window.limparRota = () => { if(controleRota) { map.removeControl(controleRota); controleRota = null; } };
        window.toggleTransito = () => { transitoAtivo ? map.removeLayer(googleTraffic) : googleTraffic.addTo(map); transitoAtivo = !transitoAtivo; };
        window.irAte = (lat, lon) => { limparRota(); map.locate({setView: false}); map.once('locationfound', (e) => { controleRota = L.Routing.control({ waypoints: [ L.latLng(e.latlng), L.latLng(lat, lon) ], language: 'pt-BR' }).addTo(map); map.closePopup(); }); };

        const pontosInteresse = { casa: { nome: "Casa", lat: -22.4818724, lon: -44.0492843, raio: 25, cor: '#00ff00', icone: "🏠" }, casaVo: { nome: "Casa da Vó", lat: -22.4816722, lon: -44.0503214, raio: 25, cor: '#ffa500', icone: "👵" }, ronoel: { nome: "Ronoel", lat: -22.47913780425358, lon: -44.0485040059705, raio: 10, cor: '#ffffff', icone: "📍" }, madson: { nome: "Madson", lat: -22.480922713559334, lon: -44.04805947755113, raio: 10, cor: '#ffffff', icone: "📍" }, padaria: { nome: "Padaria Du Vale", lat: -22.480842421901734, lon: -44.04714813233181, raio: 10, cor: '#ffa500', icone: "🥐" } };
        Object.values(pontosInteresse).forEach(p => L.circle([p.lat, p.lon], { radius: p.raio, color: p.cor, fillOpacity: 0.1, weight: 1 }).addTo(map));

        const drones = {
            g8: { marker: L.marker([0,0], {icon: L.divIcon({html:'<div class="emoji-pin">👑</div>', className:'custom-div-icon', iconSize:[30,30]})}).addTo(map), locked: false },
            miih: { marker: L.marker([0,0], {icon: L.divIcon({html:'<div class="emoji-pin">🌸</div>', className:'custom-div-icon', iconSize:[30,30]})}).addTo(map), locked: false },
            gustavo: { marker: L.marker([0,0], {icon: L.divIcon({html:'<div class="emoji-pin">🤖</div>', className:'custom-div-icon', iconSize:[30,30]})}).addTo(map), locked: false }
        };

        // --- TRAVAR COM ZOOM MÁXIMO ---
        window.toggleLock = (id) => {
            Object.keys(drones).forEach(key => {
                if(key !== id) {
                    drones[key].locked = false;
                    document.getElementById(`lock-${key}`).classList.remove('ativo');
                    document.getElementById(`lock-${key}`).innerHTML = "🔒";
                }
            });
            drones[id].locked = !drones[id].locked;
            const btn = document.getElementById(`lock-${id}`);
            btn.classList.toggle('ativo');
            btn.innerHTML = drones[id].locked ? "🔓" : "🔒";
            
            if(drones[id].locked) {
                const pos = drones[id].marker.getLatLng();
                if(pos.lat !== 0) map.setView(pos, 18); // ZOOM MÁXIMO AO TRAVAR
            }
        };

        window.focarDron = (id) => { const pos = drones[id].marker.getLatLng(); if (pos.lat !== 0) { map.flyTo(pos, 18); drones[id].marker.bindPopup(`<b>${id.toUpperCase()}</b>`).openPopup(); } };

        function verificarLocal(lat, lon) {
            for (let chave in pontosInteresse) {
                let p = pontosInteresse[chave];
                if (map.distance([lat, lon], [p.lat, p.lon]) <= p.raio) return `${p.icone} ${p.nome}`;
            }
            return "🚗 Em Trânsito";
        }

        async function atualizar(snapshot, id) {
            const data = snapshot.val(); if (!data) return;
            const keys = Object.keys(data);
            const reg = data.lat ? data : data[keys[keys.length - 1]];
            let lat = reg.lat, lon = reg.lon;
            if (reg.location && reg.location._) {
                try {
                    lat = parseFloat(reg.location._.match(/lat=([^&]+)/)[1]);
                    lon = parseFloat(reg.location._.match(/lon=([^&]+)/)[1]);
                } catch(e) {}
            }
            if (lat && lon && lat !== 0) {
                const pos = [lat, lon];
                drones[id].marker.setLatLng(pos);
                if (drones[id].locked) map.panTo(pos, { animate: true });
                document.getElementById(`loc-${id}`).innerText = verificarLocal(lat, lon);
                document.getElementById(`detalhes-${id}`).innerHTML = `<span class="status-dot online"></span> Sincronizado: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            }
        }

        onValue(ref(db, 'g8'), (s) => atualizar(s, 'g8'));
        onValue(ref(db, 'miih'), (s) => atualizar(s, 'miih'));
        onValue(ref(db, 'gustavo'), (s) => atualizar(s, 'gustavo'));
    </script>
</body>
</html>
