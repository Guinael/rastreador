<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Rastreador</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; } 
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://meu-rastreador-7a0a8-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const map = L.map('map').setView([-15.78, -47.92], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // CONFIGURAÇÃO DOS ÍCONES (Cores solicitadas)
        const criarIcone = (cor) => new L.Icon({
            iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${cor}.png`,
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        const vermelhoG8 = criarIcone('red');
        const rosaMiih = criarIcone('violet'); // Violeta é o mais próximo do rosa
        const azulGustavo = criarIcone('blue'); // Azul escuro padrão

        // Criando Marcadores
        let mG8 = L.marker([-15.78, -47.92], {icon: vermelhoG8}).addTo(map).bindPopup("G8");
        let mMiih = L.marker([-15.78, -47.92], {icon: rosaMiih}).addTo(map).bindPopup("Miih");
        let mGustavo = L.marker([-15.78, -47.92], {icon: azulGustavo}).addTo(map).bindPopup("Gustavo");

        function atualizar(snapshot, marcador) {
            const data = snapshot.val();
            if (!data) return;

            const keys = Object.keys(data);
            const lastKey = keys[keys.length - 1];
            const reg = data.lat ? data : data[lastKey];

            let lat, lon;
            if (reg.location && reg.location._) {
                const txt = reg.location._;
                const la = txt.match(/lat=([^&]+)/);
                const lo = txt.match(/lon=([^&]+)/);
                if (la && lo) { lat = parseFloat(la[1]); lon = parseFloat(lo[1]); }
            } else {
                lat = reg.lat; lon = reg.lon;
            }

            if (lat && lon) {
                marcador.setLatLng([lat, lon]);
            }
        }

        onValue(ref(db, 'g8'), (s) => atualizar(s, mG8));
        onValue(ref(db, 'miih'), (s) => atualizar(s, mMiih));
        onValue(ref(db, 'gustavo'), (s) => atualizar(s, mGustavo));
    </script>
</body>
</html>
