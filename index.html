<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Rastreador</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; } 
        body { margin: 0; padding: 0; background-color: #000; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://meu-rastreador-7a0a8-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const map = L.map('map').setView([-15.78, -47.92], 4);

        // --- CAMADA GOOGLE HYBRID (SATÉLITE + RUAS EM PORTUGUÊS) ---
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            attribution: 'Map data © Google'
        }).addTo(map);

        const criarIcone = (cor) => new L.Icon({
            iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${cor}.png`,
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        const mG8 = L.marker([-15.78, -47.92], {icon: criarIcone('red')}).addTo(map).bindPopup("G8");
        const mMiih = L.marker([-15.78, -47.92], {icon: criarIcone('violet')}).addTo(map).bindPopup("Miih");
        const mGustavo = L.marker([-15.78, -47.92], {icon: criarIcone('blue')}).addTo(map).bindPopup("Gustavo");

        function atualizarPosicao(snapshot, marcador) {
            const data = snapshot.val();
            if (!data) return;
            const keys = Object.keys(data);
            const lastKey = keys[keys.length - 1];
            const registro = data.lat ? data : data[lastKey];

            let lat, lon;
            if (registro.location && registro.location._) {
                const texto = registro.location._;
                const latMatch = texto.match(/lat=([^&]+)/);
                const lonMatch = texto.match(/lon=([^&]+)/);
                if (latMatch && lonMatch) {
                    lat = parseFloat(latMatch[1]);
                    lon = parseFloat(lonMatch[1]);
                }
            } else {
                lat = registro.lat; lon = registro.lon;
            }

            if (lat && lon && lat !== 0) {
                marcador.setLatLng([lat, lon]);
            }
        }

        onValue(ref(db, 'g8'), (s) => atualizarPosicao(s, mG8));
        onValue(ref(db, 'miih'), (s) => atualizarPosicao(s, mMiih));
        onValue(ref(db, 'gustavo'), (s) => atualizarPosicao(s, mGustavo));

    </script>
</body>
</html>
