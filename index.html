<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Radar de Monitoramento Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; } 
        body { margin: 0; padding: 0; background-color: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        #clima-painel {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: rgba(0, 0, 0, 0.85); color: white; padding: 15px;
            border-radius: 12px; border: 1px solid #444; min-width: 230px;
        }
        .info-item { margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 8px; position: relative; }
        .info-item:last-child { border-bottom: none; }
        .nome { font-weight: bold; display: block; margin-bottom: 2px; font-size: 14px; }
        .localizacao { font-size: 12px; color: #00ff00; font-weight: bold; display: block; }
        .detalhes { font-size: 11px; color: #aaa; display: block; }
        
        /* Indicador de Status (Online/Offline) */
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; display: inline-block;
            margin-right: 5px; box-shadow: 0 0 5px currentColor;
        }
        .online { color: #00ff00; background-color: #00ff00; }
        .alerta { color: #ffff00; background-color: #ffff00; }
        .offline { color: #ff4d4d; background-color: #ff4d4d; }
    </style>
</head>
<body>

    <div id="clima-painel">
        <div class="info-item">
            <span class="nome" style="color: #ff4d4d;">👑 G8</span>
            <span id="loc-g8" class="localizacao">Conectando...</span>
            <span id="detalhes-g8" class="detalhes">--</span>
        </div>
        <div class="info-item">
            <span class="nome" style="color: #ee82ee;">🌸 Miih</span>
            <span id="loc-miih" class="localizacao">Conectando...</span>
            <span id="detalhes-miih" class="detalhes">--</span>
        </div>
        <div class="info-item">
            <span class="nome" style="color: #4d94ff;">🤖 Gustavo</span>
            <span id="loc-gustavo" class="localizacao">Conectando...</span>
            <span id="detalhes-gustavo" class="detalhes">--</span>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://meu-rastreador-7a0a8-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const map = L.map('map').setView([-22.4816, -44.0494], 13);
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}').addTo(map);

        const pontosInteresse = {
            casa: { nome: "Casa", lat: -22.4816947, lon: -44.0494302, raio: 100, cor: '#00ff00' },
            trabalhoG8: { nome: "Trabalho G8", lat: -22.5068037, lon: -44.0924050, raio: 200, cor: '#ff4d4d' },
            trabalhoMiih: { nome: "Trabalho Miih", lat: -22.5192858, lon: -44.1047733, raio: 200, cor: '#ee82ee' },
            escolaGustavo: { nome: "Escola Gustavo", lat: -22.4797109, lon: -44.0458247, raio: 150, cor: '#4d94ff' }
        };

        // Desenhar zonas
        Object.values(pontosInteresse).forEach(p => {
            L.circle([p.lat, p.lon], { radius: p.raio, color: p.cor, fillOpacity: 0.1, weight: 1 }).addTo(map);
        });

        const criarIcone = (cor) => new L.Icon({
            iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${cor}.png`,
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41]
        });

        // Configuração dos Drones (Marcador + Rastro + Último Sinal)
        const drones = {
            g8: { marker: L.marker([-22.4816, -44.0494], {icon: criarIcone('red')}).addTo(map), trail: L.polyline([], {color: '#ff4d4d', weight: 3, opacity: 0.6}).addTo(map), ultimaVez: 0 },
            miih: { marker: L.marker([-22.4816, -44.0494], {icon: criarIcone('violet')}).addTo(map), trail: L.polyline([], {color: '#ee82ee', weight: 3, opacity: 0.6}).addTo(map), ultimaVez: 0 },
            gustavo: { marker: L.marker([-22.4816, -44.0494], {icon: criarIcone('blue')}).addTo(map), trail: L.polyline([], {color: '#4d94ff', weight: 3, opacity: 0.6}).addTo(map), ultimaVez: 0 }
        };

        function verificarLocal(id, lat, lon) {
            const distCasa = map.distance([lat, lon], [pontosInteresse.casa.lat, pontosInteresse.casa.lon]);
            if (distCasa <= pontosInteresse.casa.raio) return "📍 Em Casa";
            if (id === 'g8' && map.distance([lat, lon], [pontosInteresse.trabalhoG8.lat, pontosInteresse.trabalhoG8.lon]) <= pontosInteresse.trabalhoG8.raio) return "🏢 No Trabalho";
            if (id === 'miih' && map.distance([lat, lon], [pontosInteresse.trabalhoMiih.lat, pontosInteresse.trabalhoMiih.lon]) <= pontosInteresse.trabalhoMiih.raio) return "🏢 No Trabalho";
            if (id === 'gustavo' && map.distance([lat, lon], [pontosInteresse.escolaGustavo.lat, pontosInteresse.escolaGustavo.lon]) <= pontosInteresse.escolaGustavo.raio) return "📚 Na Escola";
            return "🚗 Em Trânsito / Rua";
        }

        async function atualizar(snapshot, id) {
            const data = snapshot.val();
            if (!data) return;
            const keys = Object.keys(data);
            const reg = data.lat ? data : data[keys[keys.length - 1]];

            let lat, lon;
            if (reg.location && reg.location._) {
                const txt = reg.location._;
                lat = parseFloat(txt.match(/lat=([^&]+)/)[1]);
                lon = parseFloat(txt.match(/lon=([^&]+)/)[1]);
            } else { lat = reg.lat; lon = reg.lon; }

            if (lat && lon && lat !== 0) {
                const pos = [lat, lon];
                drones[id].marker.setLatLng(pos);
                drones[id].ultimaVez = Date.now();
                
                // Adiciona ao rastro (mantém últimos 30 pontos)
                drones[id].trail.addLatLng(pos);
                if (drones[id].trail.getLatLngs().length > 30) drones[id].trail.setLatLngs(drones[id].trail.getLatLngs().slice(1));

                const local = verificarLocal(id, lat, lon);
                const vel = reg.speed ? (parseFloat(reg.speed) * 1.852).toFixed(0) : "0";
                const hora = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                document.getElementById(`loc-${id}`).innerText = local;
                document.getElementById(`detalhes-${id}`).innerHTML = `<span id="dot-${id}" class="status-dot online"></span> ${vel} km/h | ${hora}`;
            }
        }

        // Sistema de Semáforo (Verifica a cada 10 segundos)
        setInterval(() => {
            const agora = Date.now();
            Object.keys(drones).forEach(id => {
                const dot = document.getElementById(`dot-${id}`);
                if (!dot) return;
                const diff = (agora - drones[id].ultimaVez) / 1000 / 60; // Minutos

                if (diff > 10) { dot.className = "status-dot offline"; }
                else if (diff > 5) { dot.className = "status-dot alerta"; }
                else { dot.className = "status-dot online"; }
            });
        }, 10000);

        onValue(ref(db, 'g8'), (s) => atualizar(s, 'g8'));
        onValue(ref(db, 'miih'), (s) => atualizar(s, 'miih'));
        onValue(ref(db, 'gustavo'), (s) => atualizar(s, 'gustavo'));
    </script>
</body>
</html>
